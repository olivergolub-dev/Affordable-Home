# Manually push the seed file to the database (upsert + delete retired).
# See affordable-home-app/scripts/ingest.ts. Needs the SUPABASE_SERVICE_ROLE_KEY
# repo secret — the only place outside Supabase itself that key should live.
name: Ingest listings

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: affordable-home-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wrumpqswcctxtenognls.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: affordable-home-app/package-lock.json
      - run: npm ci
      - run: npx --yes tsx scripts/ingest.ts
