# Free-tier Supabase pauses a project after ~7 days without activity, which
# takes every listing on the site down with it (Sep 2026). A tiny daily read
# keeps it awake. Delete this if the project moves to a paid plan.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one listing
        env:
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://wrumpqswcctxtenognls.supabase.co/rest/v1/listings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded $code"
          [ "$code" = "200" ]
